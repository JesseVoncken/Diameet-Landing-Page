    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <div class="logo-icon"></div>

                    Diabetes managen is topsport. Heb je direct advies nodig over je voeding,

                    op je gezondheid die je verdient.
                </p>
                
                <a href="https://jessevoncken.github.io/Diameet-Frontend/" class="btn-cta">Join de Chat</a>
            </div>
            <div class="hero-image-container">
